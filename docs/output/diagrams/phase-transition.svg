<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="DejaVu Sans, sans-serif">
  <title>Line chart of R₀ over simulation ticks with phase bands: Calm (R₀ below 0.8), Outbreak (R₀ 0.8-1.5), Crisis (R₀ above 1.5); the R₀ curve peaks at 2.15, an intervention is deployed at tick 70, and the curve returns toward the Calm band (Recovery); dashed red line marks the R₀ = 1.0 epidemic threshold</title>

  <!-- Title -->
  <text x="410" y="28" font-size="17" font-weight="bold" fill="#1A365D" text-anchor="middle">R₀ Phase Transition — Disinformation Spread Dynamics</text>

  <!-- Y-axis label: horizontal, top-left of axis -->
  <text x="80" y="52" font-size="11" fill="#4A5568">R₀ (Reproduction Number)</text>

  <!-- Plot area -->
  <rect x="80" y="56" width="680" height="264" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1"/>

  <!-- R₀-value phase bands (non-overlapping, clear boundaries) -->
  <rect x="80" y="56" width="680" height="149" fill="rgba(254,215,215,0.35)"/>  <!-- Crisis: R₀ >= 1.5 -->
  <rect x="80" y="205" width="680" height="44.6" fill="rgba(254,243,199,0.45)"/> <!-- Outbreak: 0.8..1.5 -->
  <rect x="80" y="249.6" width="680" height="70.4" fill="rgba(198,246,213,0.35)"/> <!-- Calm: R₀ < 0.8 -->
  <line x1="80" y1="205" x2="760" y2="205" stroke="#A0AEC0" stroke-width="1"/>
  <line x1="80" y1="249.6" x2="760" y2="249.6" stroke="#A0AEC0" stroke-width="1"/>
  <text x="90" y="100" font-size="10.5" font-weight="bold" fill="#9B2C2C">Crisis — R₀ ≥ 1.5</text>
  <text x="90" y="230" font-size="10.5" font-weight="bold" fill="#92600A">Outbreak — R₀ ≥ 0.8</text>
  <text x="90" y="268" font-size="10.5" font-weight="bold" fill="#276749">Calm — R₀ &lt; 0.8</text>

  <!-- Major gridlines: Y every 0.5, X every 50 -->
  <line x1="80" y1="276" x2="760" y2="276" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="232" x2="760" y2="232" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="188" x2="760" y2="188" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="144" x2="760" y2="144" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="80" y1="100" x2="760" y2="100" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="250" y1="56" x2="250" y2="320" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="420" y1="56" x2="420" y2="320" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="590" y1="56" x2="590" y2="320" stroke="#E2E8F0" stroke-width="1"/>

  <!-- R₀ = 1.0 threshold: anchored label -->
  <line x1="80" y1="232" x2="760" y2="232" stroke="#E53E3E" stroke-width="1.5" stroke-dasharray="7,4"/>
  <line x1="748" y1="226" x2="748" y2="232" stroke="#C53030" stroke-width="1.25"/>
  <text x="748" y="224" font-size="9.5" fill="#C53030" text-anchor="end" font-weight="bold">R₀ = 1.0</text>

  <!-- R₀ trajectory -->
  <path d="M 80.0 249.6 C 85.7 248.1, 102.7 243.7, 114.0 240.8 C 125.3 237.9, 136.7 236.4, 148.0 232.0 C 159.3 227.6, 170.7 218.8, 182.0 214.4 C 193.3 210.0, 204.7 210.0, 216.0 205.6 C 227.3 201.2, 238.7 193.9, 250.0 188.0 C 261.3 182.1, 272.7 176.3, 284.0 170.4 C 295.3 164.5, 306.7 157.2, 318.0 152.8 C 329.3 148.4, 340.7 147.7, 352.0 144.0 C 363.3 140.3, 374.7 133.0, 386.0 130.8 C 397.3 128.6, 408.7 130.8, 420.0 130.8 C 431.3 130.8, 442.7 128.6, 454.0 130.8 C 465.3 133.0, 476.7 138.9, 488.0 144.0 C 499.3 149.1, 510.7 154.3, 522.0 161.6 C 533.3 168.9, 544.7 179.2, 556.0 188.0 C 567.3 196.8, 578.7 207.1, 590.0 214.4 C 601.3 221.7, 612.7 227.6, 624.0 232.0 C 635.3 236.4, 646.7 237.9, 658.0 240.8 C 669.3 243.7, 680.7 246.7, 692.0 249.6 C 703.3 252.5, 720.3 256.9, 726.0 258.4" fill="none" stroke="#3182CE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Intervention marker at t = 70 -->
  <line x1="318" y1="320" x2="318" y2="160" stroke="#38A169" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="318" cy="152.8" r="3.5" fill="#38A169"/>
  <path d="M312,326 L318,316 L324,326 Z" fill="#38A169"/>
  <text x="318" y="352" font-size="10.5" font-weight="bold" fill="#276749" text-anchor="middle">Intervention @ t = 70</text>

  <!-- Axes -->
  <line x1="80" y1="320" x2="760" y2="320" stroke="#4A5568" stroke-width="1.5"/>
  <line x1="80" y1="56" x2="80" y2="320" stroke="#4A5568" stroke-width="1.5"/>

  <!-- Y tick labels -->
  <text x="72" y="324" text-anchor="end" font-size="9.5" fill="#718096">0</text>
  <text x="72" y="280" text-anchor="end" font-size="9.5" fill="#718096">0.5</text>
  <text x="72" y="236" text-anchor="end" font-size="9.5" fill="#718096">1.0</text>
  <text x="72" y="192" text-anchor="end" font-size="9.5" fill="#718096">1.5</text>
  <text x="72" y="148" text-anchor="end" font-size="9.5" fill="#718096">2.0</text>
  <text x="72" y="104" text-anchor="end" font-size="9.5" fill="#718096">2.5</text>
  <text x="72" y="60" text-anchor="end" font-size="9.5" fill="#718096">3.0</text>

  <!-- X tick labels -->
  <text x="80" y="338" text-anchor="middle" font-size="9.5" fill="#718096">0</text>
  <text x="250" y="338" text-anchor="middle" font-size="9.5" fill="#718096">50</text>
  <text x="420" y="338" text-anchor="middle" font-size="9.5" fill="#718096">100</text>
  <text x="590" y="338" text-anchor="middle" font-size="9.5" fill="#718096">150</text>
  <text x="760" y="338" text-anchor="middle" font-size="9.5" fill="#718096">200</text>

  <!-- X-axis label -->
  <text x="420" y="372" font-size="11" fill="#4A5568" text-anchor="middle">Time (simulation ticks)</text>

  <!-- Legend: bottom-right, white background box -->
  <rect x="600" y="386" width="176" height="46" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="616" y1="399" x2="636" y2="399" stroke="#3182CE" stroke-width="2.5"/>
  <text x="644" y="403" font-size="11.5" fill="#4A5568">R₀ trajectory</text>
  <line x1="616" y1="419" x2="632" y2="419" stroke="#38A169" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="624" cy="419" r="3" fill="#38A169"/>
  <text x="644" y="423" font-size="11.5" fill="#4A5568">Intervention</text>
</svg>
