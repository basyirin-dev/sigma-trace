<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="DejaVu Sans, sans-serif">
  <title>Flowchart showing the S-E-I-R compartment model: susceptible population is exposed to disinformation, becomes infected and shares it, then builds resistance; σ-coherence failure drives the transition and waning immunity loops back to susceptible</title>

  <!-- Title -->
  <text x="410" y="26" font-size="16" font-weight="bold" fill="#1A365D" text-anchor="middle">S/E/I/R Compartment Model with Σ-Model Dynamics</text>

  <!-- σ-coherence badges (pill, wide enough for text) -->
  <rect x="10" y="54" width="140" height="24" rx="12" fill="#805AD5"/>
  <text x="80" y="70" font-size="11" fill="#FFFFFF" text-anchor="middle">σ-coherence — protects</text>
  <line x1="80" y1="78" x2="80" y2="90" stroke="#805AD5" stroke-width="1.5" stroke-dasharray="3,3"/>

  <rect x="670" y="54" width="140" height="24" rx="12" fill="#805AD5"/>
  <text x="740" y="70" font-size="11" fill="#FFFFFF" text-anchor="middle">Interventions boost σ</text>
  <line x1="740" y1="78" x2="740" y2="90" stroke="#805AD5" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Compartments: identical size (120x90), uniform spacing (100) -->
  <!-- S -->
  <rect x="20" y="92" width="120" height="90" rx="10" fill="#E8F4FC" stroke="#2C5282" stroke-width="2"/>
  <text x="80" y="122" font-size="26" font-weight="bold" fill="#1A365D" text-anchor="middle">S</text>
  <text x="80" y="146" font-size="14" font-weight="bold" fill="#2C5282" text-anchor="middle">Susceptible</text>
  <text x="80" y="164" font-size="10.5" fill="#4A5568" text-anchor="middle">Healthy population</text>

  <!-- E -->
  <rect x="240" y="92" width="120" height="90" rx="10" fill="#E8F4FC" stroke="#2C5282" stroke-width="2"/>
  <text x="300" y="122" font-size="26" font-weight="bold" fill="#1A365D" text-anchor="middle">E</text>
  <text x="300" y="146" font-size="14" font-weight="bold" fill="#2C5282" text-anchor="middle">Exposed</text>
  <text x="300" y="164" font-size="10.5" fill="#4A5568" text-anchor="middle">Incubating belief</text>

  <!-- I -->
  <rect x="460" y="92" width="120" height="90" rx="10" fill="#E8F4FC" stroke="#2C5282" stroke-width="2"/>
  <text x="520" y="122" font-size="26" font-weight="bold" fill="#1A365D" text-anchor="middle">I</text>
  <text x="520" y="146" font-size="14" font-weight="bold" fill="#2C5282" text-anchor="middle">Infected</text>
  <text x="520" y="164" font-size="10.5" fill="#4A5568" text-anchor="middle">Sharing disinfo</text>

  <!-- R -->
  <rect x="680" y="92" width="120" height="90" rx="10" fill="#E8F4FC" stroke="#2C5282" stroke-width="2"/>
  <text x="740" y="122" font-size="26" font-weight="bold" fill="#1A365D" text-anchor="middle">R</text>
  <text x="740" y="146" font-size="14" font-weight="bold" fill="#2C5282" text-anchor="middle">Resistant</text>
  <text x="740" y="164" font-size="10.5" fill="#4A5568" text-anchor="middle">Immunized</text>

  <!-- R₀ badge (below I) -->
  <rect x="460" y="190" width="120" height="24" rx="12" fill="#E53E3E"/>
  <text x="520" y="206" font-size="11" fill="#FFFFFF" text-anchor="middle">R₀ — spread rate</text>
  <line x1="520" y1="190" x2="520" y2="182" stroke="#E53E3E" stroke-width="1.5"/>

  <!-- Arrows: uniform 2px gray, labels 12px above with 5% gray highlight -->
  <!-- S -> E -->
  <line x1="140" y1="137" x2="232" y2="137" stroke="#718096" stroke-width="2"/>
  <polygon points="230,131 240,137 230,143" fill="#718096"/>
  <rect x="158" y="118" width="64" height="16" rx="3" fill="#F2F2F2"/>
  <text x="190" y="130" font-size="11.5" font-style="italic" fill="#4A5568" text-anchor="middle">Exposure</text>

  <!-- E -> I -->
  <line x1="360" y1="137" x2="452" y2="137" stroke="#718096" stroke-width="2"/>
  <polygon points="450,131 460,137 450,143" fill="#718096"/>
  <rect x="362" y="118" width="96" height="16" rx="3" fill="#F2F2F2"/>
  <text x="410" y="130" font-size="11.5" font-style="italic" fill="#4A5568" text-anchor="middle">Belief spreads</text>

  <!-- I -> R -->
  <line x1="580" y1="137" x2="672" y2="137" stroke="#718096" stroke-width="2"/>
  <polygon points="670,131 680,137 670,143" fill="#718096"/>
  <rect x="585" y="118" width="90" height="16" rx="3" fill="#F2F2F2"/>
  <text x="630" y="130" font-size="11.5" font-style="italic" fill="#4A5568" text-anchor="middle">Time / Intervention</text>

  <!-- Feedback loop R -> S (dashed gray) -->
  <path d="M740,182 L740,224 Q740,232 732,232 L88,232 Q80,232 80,224 L80,182" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="86,186 74,180 78,192" fill="#718096"/>
  <rect x="336" y="224" width="148" height="16" rx="3" fill="#F2F2F2"/>
  <text x="410" y="236" font-size="11.5" font-style="italic" fill="#4A5568" text-anchor="middle">Waning immunity (σ decay)</text>

  <!-- Legend: two columns, 13px -->
  <text x="20" y="260" font-size="13" font-weight="bold" fill="#1A365D">Parameters</text>
  <rect x="20" y="268" width="16" height="16" rx="3" fill="#805AD5"/>
  <text x="44" y="282" font-size="13" fill="#4A5568">σ-coherence (0–100) — resilience</text>
  <rect x="20" y="292" width="16" height="16" rx="3" fill="#E53E3E"/>
  <text x="44" y="306" font-size="13" fill="#4A5568">R₀ (0–5.0) — reproduction number</text>

  <text x="430" y="260" font-size="13" font-weight="bold" fill="#1A365D">Visual key</text>
  <rect x="430" y="268" width="16" height="16" rx="3" fill="#E8F4FC" stroke="#2C5282" stroke-width="1.5"/>
  <text x="454" y="282" font-size="13" fill="#4A5568">S/E/I/R compartments</text>
  <line x1="430" y1="296" x2="446" y2="296" stroke="#718096" stroke-width="2"/>
  <polygon points="446,292 452,296 446,300" fill="#718096"/>
  <text x="454" y="300" font-size="13" fill="#4A5568">Compartment flow</text>
  <line x1="430" y1="320" x2="446" y2="320" stroke="#718096" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="454" y="324" font-size="13" fill="#4A5568">Waning immunity loop</text>
</svg>
